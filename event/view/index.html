    <script>
        // Theme toggle functionality for sidebar button
        const sidebarThemeBtn = document.getElementById('sidebar-theme-toggle');
        const sunIcon = sidebarThemeBtn?.querySelector('.sun-icon');
        const moonIcon = sidebarThemeBtn?.querySelector('.moon-icon');

        function updateThemeIcons(isDark) {
            if (sunIcon && moonIcon) {
                if (isDark) {
                    sunIcon.style.display = 'none';
                    moonIcon.style.display = 'inline-block';
                } else {
                    sunIcon.style.display = 'inline-block';
                    moonIcon.style.display = 'none';
                }
            }
        }

        if (sidebarThemeBtn) {
            sidebarThemeBtn.addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                updateThemeIcons(isDark);
            });
        }

        // Check saved theme on load
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            updateThemeIcons(true);
        } else {
            updateThemeIcons(false);
        }
    </script>
