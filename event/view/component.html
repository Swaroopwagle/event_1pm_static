<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/button.css">
   

</head>
<body>

    <!-- Main Ticket Button -->
<!-- 1. Hero Section - Strongest CTA -->
<button class="btn btn-primary btn-lg">
  Get Tickets Now
</button>

<!-- 2. Event Card - Quick Action -->
<button class="btn btn-primary btn-sm">
  Book Now
</button>

<!-- 3. Urgency on Event Page -->
<button class="btn btn-tertiary">
  Only 12 Tickets Left – Buy Now
</button>

<!-- 4. Premium Offer -->
<button class="btn btn-glow">
  ✨ Book VIP Experience
</button>

<!-- 5. Supporting Action -->
<button class="btn btn-secondary">
  Send Tickets to Gmail
</button>

<!-- 6. Neutral / Informational -->
<button class="btn btn-outline">
  View Event Details
</button>

<!-- 7. Success State (After Booking) -->
<button class="btn btn-success">
  Ticket Sent to Gmail ✓
</button>

<!-- 8. Mobile Checkout -->
<button class="btn btn-primary btn-full btn-lg">
  Confirm Booking & Pay
</button>


<!-- Theme Toggle Button -->
<button class="theme-toggle-btn">
    <span class="sun-icon">☀️</span>
    <span class="moon-icon">🌙</span>
  </button>

  <h1>ththt</h1>
     <script src="js/theme.js"></script>
</body>
</html>
