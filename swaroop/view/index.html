<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanging Locket Swing</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  perspective: 1400px;
  background: radial-gradient(circle at center, #1f2937, #0b0f19);
  overflow: hidden;
}

/* 3D Grid Background */
.bg-grid {
  position: absolute;
  width: 200%;
  height: 200%;
  background-image: 
      linear-gradient(#30FFAF22 1px, transparent 1px),
      linear-gradient(90deg, #30FFAF22 1px, transparent 1px);
  background-size: 60px 60px;
  transform: rotateX(65deg) translateY(-250px);
  transform-origin: top;
}

/* Pendulum container */
.pendulum {
  transform-origin: top center;
}

/* Chain link */
.chain-link {
  width: 6px;
  height: 14px;
  border: 2px solid #bbb;
  border-radius: 50%;
  margin: -3px auto;
  background: linear-gradient(to bottom, #eee, #555);
}

/* Locket */
.locket {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 3px solid #30FFAF;
  background: #1F2937;
  box-shadow: 0 0 25px #30FFAF;
  position: relative;
  overflow: hidden;
}

/* Photo inside locket */
.locket img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
}
</style>
</head>
<body class="flex justify-center items-start pt-20 relative">

<!-- Background grid -->
<div class="bg-grid"></div>

<!-- Pendulum -->
<div id="pendulum" class="pendulum flex flex-col items-center z-10">

  <!-- Fixed point -->
  <div class="w-4 h-4 bg-[#30FFAF] rounded-full shadow-[0_0_20px_#30FFAF]"></div>

  <!-- Chain -->
  <div id="chain" class="flex flex-col items-center"></div>

  <!-- Locket -->
  <div id="locket" class="locket mt-2">
    <img src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?fit=crop&w=300&q=80" alt="Person">
  </div>

</div>

<script>
const pendulum = document.getElementById("pendulum");
const chain = document.getElementById("chain");

// Create realistic chain
const chainLength = 15;
for (let i = 0; i < chainLength; i++) {
  const link = document.createElement("div");
  link.className = "chain-link";
  chain.appendChild(link);
}

// Physics variables
let dropY = -300;
let velocityY = 0;
let gravity = 1.2;
let bouncing = true;

let angle = 0;
let angularVelocity = 0;
let damping = 0.995;
let swinging = false;

function animate() {
  // Drop + Bounce
  if (bouncing) {
    velocityY += gravity;
    dropY += velocityY;

    if (dropY >= 0) {
      dropY = 0;
      velocityY *= -0.4; // bounce
      if (Math.abs(velocityY) < 2) {
        bouncing = false;
        swinging = true;
        angle = 20; // starting swing
      }
    }

    pendulum.style.transform = `translateY(${dropY}px)`;
  }

  // Swing
  if (swinging) {
    let acceleration = -0.6 * Math.sin(angle * Math.PI / 180);
    angularVelocity += acceleration;
    angularVelocity *= damping;
    angle += angularVelocity;

    pendulum.style.transform = `rotate(${angle}deg)`;
  }

  requestAnimationFrame(animate);
}

// Start animation
animate();
</script>

</body>
</html>
